<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAF7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      /* Full-screen, no page scroll or bounce; dvh so mobile browser bars don't cause overflow. */
      html,
      body {
        height: 100%;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: var(--bg, #fafaf7);
      }
      /* The flashcard screen: taps are only for audio, reveal and buttons, never text selection or lookups. */
      #deck,
      #deck * {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // The last theme's background (saved by the app), so the page doesn't flash before JS loads.
      try {
        const bg = localStorage.getItem('themeBg');
        if (bg) {
          document.documentElement.style.setProperty('--bg', bg);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
        }
      } catch {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
